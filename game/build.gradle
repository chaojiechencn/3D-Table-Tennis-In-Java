plugins {
    id 'java-library'
}

dependencies {
    api project(':engine')
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the headless physics validation suite'
    dependsOn tasks.named('testClasses')
    mainClass = 'tabletennis.engine.SelfTest'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('rallyTest', JavaExec) {
    group = 'verification'
    description = 'Runs the headless gameplay validation suite'
    dependsOn tasks.named('testClasses')
    mainClass = 'tabletennis.game.RallyTest'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('writeGoldenTrace', JavaExec) {
    group = 'verification'
    description = 'Rewrites the golden trace fixture; only after a deliberate behavior change'
    dependsOn tasks.named('testClasses')
    mainClass = 'tabletennis.game.GoldenTrace'
    classpath = sourceSets.test.runtimeClasspath
    args file('src/test/resources/tabletennis/game/golden-trace.txt').absolutePath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.named('test') {
    dependsOn tasks.named('selfTest'), tasks.named('rallyTest')
}
