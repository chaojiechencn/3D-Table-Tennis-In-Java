plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

dependencies {
    implementation project(':game')
    testImplementation testFixtures(project(':engine'))
}

application {
    mainClass = 'tabletennis.app.TableTennisApp'
}

// .\gradlew.bat run -Pdev : developer mode, straight onto the table with every key and overlay.
run {
    if (project.hasProperty('dev')) args '--dev=true'
}
