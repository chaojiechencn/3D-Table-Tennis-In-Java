plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

application {
    mainClass = 'Table_Tennis_In_3D'
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the headless physics validation suite'
    dependsOn tasks.named('testClasses')
    mainClass = 'physics.SelfTest'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('rallyTest', JavaExec) {
    group = 'verification'
    description = 'Runs the headless gameplay validation suite'
    dependsOn tasks.named('testClasses')
    mainClass = 'play.RallyTest'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// These suites are executable mains, so test/check/build must invoke them explicitly.
// No framework tests are expected: failure comes from either suite's nonzero exit.
tasks.named('test') {
    dependsOn tasks.named('selfTest'), tasks.named('rallyTest')
    failOnNoDiscoveredTests = false
}
