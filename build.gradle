plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
}

application {
    mainClass = 'Table_Tennis_In_3D'
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the headless physics validation suite'
    mainClass = 'physics.SelfTest'
    classpath = sourceSets.main.runtimeClasspath
}